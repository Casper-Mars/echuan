  /v1/workers/heartbeat:
    post:
      operationId: heartbeatWorker
      summary: Worker 注册与心跳（空闲时携带派单命令）
      description: |
        一次往返完成注册、续活、续租与派单（技术方案 v0.6 §4.1），
        全部步骤在同一个写事务里执行。
        - 首次调用不带 `worker_id`，服务端生成 `w_` 前缀的 id 并在响应的
          `worker.worker_id` 里返回；此后必须复用该 id（客户端不能自选 id）。
        - 带未知 `worker_id` 返回 409 `worker_unknown`：该行已被保留期回收，
          worker 应丢弃旧 id 重新注册，而不是原样重试。
        - `state` 缺省为 `idle`。三个概念相互独立，不要混为一谈：
          - **占用判定**：只看注册表指针 `current_task_id`，与 `state` 无关；
            `state=idle` 但仍持卡仍算占用。
          - **派单条件**：`state=idle` **且** 指针为空才会被派单；
            `state=busy` 即使无卡也不会被派单。
          - **续租条件**：指针非空 **且** `state=busy` 才会续租；
            持卡却发 `state=idle` 时只保留指针、不续租，卡在租约到期后
            由回收流程释放。
        - 空闲且未持卡的 worker 拿到下一张可领卡：`commands` 出现一条 `kind=run_task`，
          其 `task`/`lease`/`context` 与 `POST /v1/tasks/claim` 的 200 响应同构
          （复用 `ClaimedTask` / `ClaimLease` / `ClaimContext`）。
        - 无任务可派时 `commands` 为 `[]`，不是 null。
      tags: [workers]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          description: |
            心跳成功。`commands` 为空数组表示暂无任务；`worker` 是写入后的快照，
            `presence` 由 `last_seen` 与 `worker_ttl` 推导（不落库），
            `heartbeat_interval_ms` / `lease_ttl_seconds` 来自服务端配置，
            worker 不应硬编码这两个节奏。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHeartbeatResponse"
              examples:
                idleNoCommands:
                  summary: 空闲且队列为空（注册后的稳定心跳）
                  value:
                    worker:
                      worker_id: w_01M5Z45MXYVDV3FAHG543RZ5JQ
                      presence: active
                      state: idle
                      current_task_id: null
                      metadata:
                        host: build-01
                        os: linux
                        agent_version: 0.6.0
                      first_seen: "2026-10-27T16:47:51.23Z"
                      last_seen: "2026-10-27T16:47:51.23Z"
                      heartbeat_interval_ms: 15000
                      lease_ttl_seconds: 90
                    commands: []
                dispatchRunTask:
                  summary: 空闲 worker 被派单（队列有可领取任务）
                  value:
                    worker:
                      worker_id: w_01M5Z45MXYVDV3FAHG543RZ5JQ
                      presence: active
                      state: busy
                      current_task_id: APP-1-T0001
                      metadata:
                        host: build-01
                        os: linux
                        agent_version: 0.6.0
                      first_seen: "2026-10-27T16:47:51.23Z"
                      last_seen: "2026-10-27T16:47:55.157Z"
                      heartbeat_interval_ms: 15000
                      lease_ttl_seconds: 90
                    commands:
                      - kind: run_task
                        task:
                          id: APP-1-T0001
                          project_id: APP-1
                          title: 实现登录接口
                          body_md: "# 任务正文\n"
                          attempt: 1
                          priority: 10
                        lease:
                          lease_id: l_9f8b7b09ff971dd1
                          until: "2026-10-27T16:49:25.157Z"
                          ttl_seconds: 90
                        context:
                          spec_version: 1
                          spec_digest: "sha256:bb23da360a3b21e827138bad027ef3f30a29699e84014bc520e4f40131ea2d76"
                          product:
                            id: APP
                            name: 驿传示例产品
                            git_url: git@example.com:APP.git
                          workdir: /var/lib/echuan/workspaces/APP-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            `worker_unknown`：请求带了注册表中不存在的 `worker_id`
            （未注册，或行已被保留期回收）。这是唯一一个"换新 id 重新注册即可恢复"
            的 409；返回时 `worker` 状态未做任何写入。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/workers:
    get:
      operationId: listWorkers
      summary: 列出 Worker，或按 ?id= 取详情
      description: |
        同一个 path+method 承载两种读形态，由 `?id=` 是否出现区分：
        - 不带 `id`：分页列表，按 `last_seen` 倒序；`limit` 缺省 50、范围 1~200；
          `cursor` 为不透明游标，`next_cursor` 只在还有下一页时出现。
        - 带 `id`：单条详情，返回裸 `Worker`（没有 `items` 包装）；
          `?id=` 为空是 400，id 不存在是 404 `not_found`；
          查询语义用 404，与心跳的 409 `worker_unknown` 区分。

        为什么不拆成 `GET /v1/workers/{id}`：实现与既有客户端用查询参数寻址，
        而 OpenAPI 3.0 的一个 method+path 只能定义一个 operation，
        无法把两种响应结构声明成两个 operation。因此这里用
        `oneOf: [Worker, WorkerList]` 表达，客户端按响应中是否存在 `items` 区分形态。
      tags: [workers]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          description: 出现即进入详情形态；空值为 400，未知 id 为 404。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 列表形态的分页大小，缺省 50、范围 1~200；详情形态忽略。
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: 列表形态的不透明游标（上一页的 next_cursor）；详情形态忽略。
          schema:
            type: string
      responses:
        "200":
          description: 详情（带 `id` 时返回 `Worker`）或分页列表（返回 `WorkerList`，last_seen 倒序）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Worker"
                  - $ref: "#/components/schemas/WorkerList"
              examples:
                detail:
                  summary: 详情（?id=）
                  value:
                    worker_id: w_01M5Z45MXYVDV3FAHG543RZ5JQ
                    presence: active
                    state: busy
                    current_task_id: APP-1-T0001
                    metadata:
                      host: build-01
                      os: linux
                      agent_version: 0.6.0
                    first_seen: "2026-10-27T16:47:51.23Z"
                    last_seen: "2026-10-27T16:47:55.157Z"
                    heartbeat_interval_ms: 15000
                    lease_ttl_seconds: 90
                list:
                  summary: 列表（不带 id，按 last_seen 倒序）
                  value:
                    items:
                      - worker_id: w_01M5Z46001XPF5KM50RT9QKR48
                        presence: active
                        state: idle
                        current_task_id: null
                        metadata:
                          host: build-02
                        first_seen: "2026-10-27T16:48:02.561Z"
                        last_seen: "2026-10-27T16:48:02.561Z"
                        heartbeat_interval_ms: 15000
                        lease_ttl_seconds: 90
                      - worker_id: w_01M5Z45MXYVDV3FAHG543RZ5JQ
                        presence: active
                        state: busy
                        current_task_id: APP-1-T0001
                        metadata:
                          host: build-01
                          os: linux
                          agent_version: 0.6.0
                        first_seen: "2026-10-27T16:47:51.23Z"
                        last_seen: "2026-10-27T16:47:55.157Z"
                        heartbeat_interval_ms: 15000
                        lease_ttl_seconds: 90
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/materials:
