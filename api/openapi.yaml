      summary: 审批任务批次
      description: |
        `approve`：把项目的全部 `backlog` 卡置为 `ready`，在同一事务里清空项目
        的驳回字段并推进项目：
        - `tasks_review`(5) → `pending_done`(6)：首次批次审批。
        - `pending_done`(6) → `pending_done`(6)：待完成阶段加卡后再次审批，
          新卡变 `ready` 而项目停在 6；等全部卡片结清后项目才到 7。
        没有 `backlog` 卡时返回 409 `invalid_state`，且不产生写入。
        `reject`：`reason` 必填（缺失/空白返回 400），只写入
        `tasks_review_reason` / `tasks_review_rejected_at`、版本与操作人；
        卡片与项目状态都不变（5 仍 5、6 仍 6），重复驳回覆盖旧值。
        项目不在 5/6 时返回 409 `invalid_state`。
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
