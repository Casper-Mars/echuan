      additionalProperties: false
      required: [task, lease, context]
      properties:
        task:
          $ref: "#/components/schemas/ClaimedTask"
        lease:
          $ref: "#/components/schemas/ClaimLease"
        context:
          $ref: "#/components/schemas/ClaimContext"
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [lease_id]
      properties:
        lease_id:
          type: string
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [lease_id, until, ttl_seconds]
      properties:
        lease_id:
          type: string
        until:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
    Worker:
      type: object
      additionalProperties: false
      required: [worker_id, presence, state, current_task_id, metadata, first_seen, last_seen, heartbeat_interval_ms, lease_ttl_seconds]
      description: |
        注册表里一个 worker 的读模型。九个字段在每条响应（心跳、列表、详情）里
        恒定出现：`current_task_id` 空闲时为 `null`，`metadata` 未提供时为 `{}`，
        所以 `required` 覆盖全部字段——缺键即违约，而不是"可选字段未出现"。
      properties:
        worker_id:
          type: string
          description: 服务端生成的 `w_` 前缀业务 id；客户端只读。
        presence:
          type: string
          enum: [active, offline]
          description: 由 last_seen 与 worker_ttl 推导的在线状态（不落库）。
        state:
          type: string
          enum: [idle, busy]
          description: |
            worker 最近一次心跳声明的状态，是"声明值"而非占用事实：
            声明 idle 但 current_task_id 非空仍算占用。占用只以指针为准。
        current_task_id:
          type: string
          nullable: true
          description: 当前持有的任务业务 id（`APP-1-T0001` 形态）；空闲为 null。
        metadata:
          type: object
          additionalProperties: true
          description: |
            worker 自报的自由格式对象（列默认 `{}`，非对象在心跳时被 400 拒绝）。
        first_seen:
          type: string
          format: date-time
          description: 首次注册时间（RFC3339，UTC）。
        last_seen:
          type: string
          format: date-time
          description: 最近一次成功心跳时间（RFC3339，UTC）。
        heartbeat_interval_ms:
          type: integer
          description: 服务端期望的心跳间隔（毫秒），来自配置。
        lease_ttl_seconds:
          type: integer
          description: 服务端发放的租约时长（秒），来自配置，与 claim 的 ttl_seconds 同源。
    WorkerHeartbeatRequest:
      type: object
      additionalProperties: false
      description: |
        三个字段都可省略。worker_id 缺省表示首次注册；state 缺省为 idle；
        metadata 缺省表示不修改已存文档。
      properties:
        worker_id:
          type: string
          description: |
            首次注册留空（服务端生成并返回）；之后每次心跳必须回填响应里的
            `worker.worker_id`。未知 id 返回 409 worker_unknown。
        state:
          type: string
          enum: [idle, busy]
          description: 缺省 idle。busy 时续租已持有的卡；不等于"占用"，占用看指针。
        metadata:
          type: object
          additionalProperties: true
          description: |
            自由格式对象，必须为 JSON object（数组/字符串/null 返回 400），
            序列化后超过 worker_metadata_max_bytes 返回 413。
            提供即整体替换已存文档。
    WorkerCommand:
      type: object
      additionalProperties: false
      required: [kind, task, lease, context]
      description: |
        心跳返回给 worker 的一条指令。当前 kind 枚举只有 `run_task`，故
        `kind`/`task`/`lease`/`context` 四者恒定同时出现（后三者非 null）。
        注意：OpenAPI 3.0 无法表达条件必填，将来新增 kind（如不携带任务的指令）
        时，必须改为按 kind 分支的 schema，不能沿用这份 required。
      properties:
        kind:
          type: string
          enum: [run_task]
        task:
          allOf:
            - $ref: "#/components/schemas/ClaimedTask"
        lease:
          allOf:
            - $ref: "#/components/schemas/ClaimLease"
        context:
          allOf:
            - $ref: "#/components/schemas/ClaimContext"
    WorkerHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [worker, commands]
      description: 心跳 200 响应；`commands` 恒为数组（无任务时 `[]`，不会省略或为 null）。
      properties:
        worker:
          $ref: "#/components/schemas/Worker"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/WorkerCommand"
    WorkerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        next_cursor:
          type: string
    ReportRequest:
      type: object
      additionalProperties: false
      required: [lease_id, summary_md]
      properties:
        lease_id:
          type: string
        summary_md:
          type: string
    TaskDecideRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, rework, retry, abandon]
        reason:
          type: string
