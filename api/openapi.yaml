openapi: 3.0.3
info:
  title: 驿传平台 API
  version: 1.0.0
  description: |
    驿传（echuan）HTTP 接口契约。所有 /v1 响应都携带 X-Request-Id 头；
    错误响应统一使用 Error 错误体，details 永远是数组（无明细时为 []）。
    资源列表与详情共用同一路径（?id= 选择详情），因此一个 method+path
    只计一个 operation。
servers:
  - url: http://127.0.0.1:8720
tags:
  - name: health
    description: 存活、就绪与版本信息
  - name: products
    description: 产品
  - name: projects
    description: 项目（需求、规格、方案与评审）
  - name: tasks
    description: 任务、领取、心跳、报告与验收
  - name: materials
    description: 物料下载与版本链
  - name: inbox
    description: 待评审收件箱
  - name: workers
    description: Worker 注册、心跳与在线查询
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      tags: [health]
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针
      tags: [health]
      responses:
        "200":
          description: 就绪
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（保留 checks 并带 request_id）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /version:
    get:
      operationId: getVersion
      summary: 构建版本
      tags: [health]
      responses:
        "200":
          description: 版本信息
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/products:
    post:
      operationId: createProduct
      summary: 创建产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetProducts
      summary: 列出产品，或按 ?id= 取详情
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 详情（?id=）或分页列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Product"
                  - $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: 修改产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchRequest"
      responses:
        "200":
          description: 已修改
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      summary: 删除没有项目的产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: 已删除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects:
    post:
      operationId: createProject
      summary: 创建项目并写入首个需求版本
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetProjects
      summary: 列出项目，或按 ?id= 取详情
      description: |
        不带 ?id= 时返回项目分页列表，按项目 id 倒序（最新在前）；cursor 为上一页最后一条的 id，
        下一页返回更早的项目。带 ?id= 时返回该项目的详情。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 按项目状态过滤（九态）：0 requirement_draft / 1 requirement_review / 2 spec_draft / 3 spec_review / 4 tasks_draft / 5 tasks_review / 6 pending_done / 7 completed / 8 cancelled
          schema:
            type: integer
            enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 详情（?id=）或分页列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProjectDetail"
                  - $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: 修改项目标题
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
      responses:
        "200":
          description: 已修改
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: 删除草稿或已取消的项目
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: 已删除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/requirement:
    post:
      operationId: writeProjectRequirement
      summary: 追加需求版本
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementRequest"
      responses:
        "200":
          description: 需求版本已追加
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/specs:
    post:
      operationId: submitProjectSpec
      summary: 提交规格版本
      description: 兼容接口：修订项目第一份独立方案；项目 spec 指针指向本次提交的该份文档版本，不再生成汇总方案包。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRequest"
      responses:
        "200":
          description: 规格版本已提交
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/plans:
    post:
      operationId: submitProjectPlan
      summary: 批量添加任务卡
      description: |
        向 `tasks_draft`(4) / `tasks_review`(5) / `pending_done`(6) 的项目批量添加任务卡，
        新卡一律以 `backlog`(0) 落库。项目处于 `tasks_draft` 时，本批第一张卡会在同一事务里
        把项目推进到 `tasks_review`(5)。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: 方案已提交
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/submit:
    post:
      operationId: submitProject
      summary: 草稿提交评审
      description: |
        按当前状态进入对应的评审门：
        - `requirement_draft`(0) → `requirement_review`(1)：要求需求文档已存在；
        - `spec_draft`(2) → `spec_review`(3)：要求至少存在一份方案文档；
        - `tasks_draft`(4) → `tasks_review`(5)：任务拆分阶段的报告也会走这条边。
        提交会清空 `reason`。

        `requirement_draft` 缺少需求文档时返回 409 `invalid_state`，message 固定为
        `请先上传需求文档`；前端在提交前会先读取项目详情并做同样的拦截。

        阶段工作项（requirement/design/breakdown）的门禁通过会在同一事务里
        结清对应阶段项并自动入队下一阶段项，因此手工 submit 与 worker 报告
        可以共存；被手工跳过的阶段项按 cancelled 结清，不会阻塞项目完成。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 已进入评审
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/decide:
    post:
      operationId: decideProject
      summary: 审批项目评审门
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDecideRequest"
      responses:
        "200":
          description: 已审批
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDecision"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/cancel:
    post:
      operationId: cancelProject
      summary: 取消非终态项目
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 已取消
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/materials:
    get:
      operationId: listProjectMaterials
      summary: 查询某一类物料的版本链
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - name: kind
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 2]
      responses:
        "200":
          description: 版本链
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/gate-decisions:
    get:
      operationId: listGateDecisions
      summary: 查询项目的门禁决策历史
      description: |
        返回项目级（requirement / spec / plan）与该项目下所有工作项级的
        批准/驳回记录，按 id 倒序。material_id 指向当次被审的资料物理版本；
        资料升到 v2 后旧记录仍指向 v1。自动结清不是人工决策，不产生记录。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
            enum: [project, work_item]
        - name: subject_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 决策历史
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateDecisionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/projects/package:
    get:
      operationId: downloadProjectPackage
      summary: 下载项目资料包
      description: |
        服务端按需组装 zip：需求当前版本 + 每份独立方案的当前版本，每份文档一个 Markdown 文件，
        文件名带编号与版本（如 `需求-v3-登录页改版.md`、`方案-S0001-v2-接口设计.md`）。
        不落库、不改变任何指针；无需求且无方案时返回零条目的合法 zip。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 项目资料包（zip 字节流，支持 HEAD）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Content-Disposition:
              description: attachment 文件名（filename* 为 UTF-8 中文名）
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs:
    get:
      operationId: listOrGetSpecDocument
      summary: 查询独立技术方案列表或全文与历史版本
      description: id 指定方案时返回详情，可用 material_id 阅读该方案历史版本；否则必须用 project_id 查询列表。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          schema: {type: string}
        - name: project_id
          in: query
          schema: {type: string}
        - name: material_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: 独立方案详情或列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SpecDocument"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSpecDocument
      summary: 创建独立技术方案
      description: 仅规格评审、规划中可写。每份方案独立版本链；项目 spec 指针指向该方案的当前版本，完整资料包按需下载。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, title, body_md]
              properties:
                project_id: {type: string}
                title: {type: string}
                body_md: {type: string}
      responses:
        "201":
          description: 独立方案已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    patch:
      operationId: reviseSpecDocument
      summary: 修订独立方案
      description: If-Match 为该独立文档的版本；任何方案修订也递增项目版本，使旧项目评审请求失效。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, body_md]
              properties:
                title: {type: string}
                body_md: {type: string}
      responses:
        "200":
          description: 新版本已保存
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/work-items:
    post:
      operationId: createWorkItem
      summary: 在规划中的项目里新增一个 work item
      tags: [work-items]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetWorkItems
      summary: 列出 work item，或按 ?id=/?work_id= 取详情
      tags: [work-items]
      parameters:
