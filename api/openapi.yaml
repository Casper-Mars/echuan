    ClaimRequest:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product:
          type: string
          description: 产品业务 id；不存在返回 404 not_found。
        task_id:
          type: string
          description: 只领这一张卡（可选）；不可领取时按"无可领任务"返回 204。
        worker_id:
          type: string
          description: |
            可选的 worker 业务 id（`w_` 前缀）。省略时保持无注册表的旧行为：
            只发租约、不写 worker 指针。
            提供时在同一事务内校验并绑定指针：
            - 未知 worker → 409 `worker_unknown`；
            - worker 已持卡（`current_task_id` 非空）→ 409 `worker_busy`；
            - 无可领任务 → 204，且**不写指针、不发租约**；
            - 不同 worker 并发抢同一张卡时，失败方按"无可领任务"返回 204
              （写连接串行 + 唯一索引决定，失败方看到的是已被领走，而不是 409）。
            worker_busy 只描述"这个 worker 已经有卡"，不用于表达"队列空了"，
            也不用于并发抢卡失败（后者一律为 204）。
    ClaimedTask:
      type: object
      additionalProperties: false
      required: [id, project_id, title, body_md, attempt, priority]
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        body_md:
          type: string
        attempt:
          type: integer
        priority:
          type: integer
