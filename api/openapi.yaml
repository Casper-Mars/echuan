      type: object
      additionalProperties: false
      required: [lease_id, until, ttl_seconds]
      properties:
        lease_id:
          type: string
        until:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
    ClaimProduct:
      type: object
      additionalProperties: false
      required: [id, name, git_url]
      properties:
        id:
          type: string
        name:
          type: string
        git_url:
          type: string
