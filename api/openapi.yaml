openapi: 3.0.3
info:
  title: 驿传平台 V3 API
  version: 3.0.0
  description: |
    项目是容器，任务是唯一执行单元，流程由 task_deps 依赖图表达。
    本文件是 V3 路由清单；v2 的项目阶段与 work-items 路由已删除。
servers:
  - url: /
tags:
  - name: health
  - name: products
  - name: projects
  - name: tasks
  - name: workers
  - name: materials
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [health]
      responses:
        '200': { description: alive }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      tags: [health]
      responses:
        '200': { description: ready }
        '503': { description: not ready }
  /version:
    get:
      operationId: version
      summary: Build information
      tags: [health]
      responses:
        '200': { description: version }
  /v1/products:
    post:
      operationId: createProduct
      summary: Create a product
      tags: [products]
      responses:
        '201': { description: created }
        '400': { description: invalid argument }
        '409': { description: duplicate product_id }
    get:
      operationId: listOrGetProduct
      summary: List products or fetch one by id
      tags: [products]
      responses:
        '200': { description: product or page }
        '404': { description: not found }
    patch:
      operationId: updateProduct
      summary: Update a product
      tags: [products]
      responses:
        '200': { description: updated }
        '404': { description: not found }
    delete:
      operationId: deleteProduct
      summary: Delete a product
      tags: [products]
      responses:
        '204': { description: deleted }
        '409': { description: product still has projects }
  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project container
      tags: [projects]
      responses:
        '201': { description: created }
        '400': { description: invalid argument }
        '404': { description: product not found }
    get:
      operationId: listOrGetProject
      summary: List projects (newest first) or fetch one by id
      description: |
        With `id` the single project is returned. Otherwise a page of projects is
        returned ordered by `id DESC` — newest first. `next_after_id` is the
        smallest id of the page and is the cursor for the next, *older* page:
        pass it back as `after_id` to continue. Omitting `after_id` returns the
        first (newest) page. `product_id` filters by the product business id;
        a blank value means "no filter" and an unknown value returns 200 with an
        empty `items` array (it is a filter, not a resource locator).
      tags: [projects]
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: Business project id. When present, returns that single project instead of a page; the list parameters are then ignored.
        - name: product_id
          in: query
          required: false
          schema: { type: string }
          description: Product business id filter (not the internal numeric FK). Trimmed; blank means no filter. Unknown value yields 200 with empty items.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, closed] }
          description: Project status filter. Any other value is a 400 invalid_argument.
        - name: after_id
          in: query
          required: false
          schema: { type: integer }
          description: Keyset cursor — returns projects with a smaller id, i.e. the page older than this id. Omit it (or pass 0) for the first, newest page.
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: Page size. Defaults to 50 when omitted or not positive.
      responses:
        '200': { description: project, or a page of projects ordered newest first }
        '400': { description: invalid status }
        '404': { description: not found }
    patch:
      operationId: updateProject
      summary: Update project name or context
      tags: [projects]
      responses:
        '200': { description: updated }
        '400': { description: invalid argument }
        '404': { description: not found }
  /v1/projects/materials:
    get:
      operationId: listProjectMaterials
      summary: Materials produced inside a project (derived from tasks; source_material_id pairs a brief with its version; each item carries the task_id that produced it)
      tags: [projects]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [input, output] } }
      responses:
        '200': { description: materials }
        '400': { description: id is required / invalid role }
        '404': { description: project not found }
  /v1/projects/close:
    post:
      operationId: closeProject
      summary: Close a project
      tags: [projects]
      responses:
        '204': { description: closed }
        '404': { description: not found }
        '409': { description: unfinished tasks }
  /v1/projects/reopen:
    post:
      operationId: reopenProject
      summary: Reopen a closed project
      tags: [projects]
      responses:
        '204': { description: reopened }
        '404': { description: not found }
  /v1/tasks:
    post:
      operationId: createTask
      summary: Create a task
      description: |
        `kind` is a stage spelling: the stage `name` (the public identifier, e.g.
        `design` or `safety_review`), its `label` (the display name) or its
        numeric `id` as a string. The platform maps it to `tasks.kind`; a value the
        configuration does not know is a 400 whose message lists every usable
        `name(label)`.

        The response carries `kind` (name), `kind_id`, `kind_label` and
        `material_kind`.
      tags: [tasks]
      responses:
        '201': { description: created }
        '400': { description: invalid argument }
        '404': { description: project not found }
        '409': { description: project closed or duplicate active doc task }
    get:
      operationId: listOrGetTask
      summary: List tasks or fetch one by id
      description: |
        Every task carries `kind` = the stage name, plus `kind_id`,
        `kind_label` and `material_kind`. A card whose stage the configuration no
        longer has answers `kind` = `kind_label` = `kind(<id>)` and an empty
        `material_kind` instead of failing. The `kind` filter accepts the same
        spellings as creation (name, label or numeric id).
      tags: [tasks]
      responses:
        '200': { description: task or page }
        '400': { description: invalid kind or status }
        '404': { description: not found }
    patch:
      operationId: updateTask
      summary: Edit an unclaimed task
      tags: [tasks]
      responses:
        '200': { description: updated }
        '400': { description: invalid argument }
        '404': { description: not found }
        '409': { description: task already started }
    delete:
      operationId: deleteTask
      summary: Delete an unclaimed task
      tags: [tasks]
      responses:
        '204': { description: deleted }
        '404': { description: not found }
        '409': { description: task started or has dependents }
  /v1/tasks/attach:
    post:
      operationId: attachMaterial
      summary: Attach a material to a project or task
      tags: [tasks]
      responses:
        '201': { description: attached }
        '400': { description: invalid owner or role }
        '404': { description: owner or material not found }
  /v1/tasks/claim:
    post:
      operationId: claimTask
      summary: Lease the next ready task of a kind
      description: |
        Body `{worker_id, kind}`; `kind` is a stage spelling (name, label or
        numeric id) mapped to `tasks.kind` by the platform. The worker registry is checked **before** the
        queue, so an unregistered `worker_id` is a 409 even when nothing is
        waiting (that id could otherwise spin forever on 204). One worker holds
        at most one card (`ux_tasks_worker_lease`): a second claim while the
        first lease is still live is also a 409, and the queued card is left
        untouched. Both 409s carry `code=conflict`; the reason is in `message`
        (「未注册」/「已持卡」), not in a separate code.
      tags: [tasks]
      responses:
        '200': { description: leased task (dispatch envelope) }
        '204': { description: no ready task — empty body, not an error }
        '400': { description: invalid_argument — blank worker_id or invalid kind }
        '409': { description: 'conflict — `message` contains 「未注册，请先发一次心跳」(recovery: POST /v1/workers/heartbeat, then claim again) or 「已持卡」(recovery: report the held card or wait for the lease to expire)' }
  /v1/tasks/lease:
    post:
      operationId: renewLease
      summary: Renew a task lease
      tags: [tasks]
      responses:
        '200': { description: renewed }
        '409': { description: lease lost }
  /v1/tasks/report:
    post:
      operationId: reportTask
      summary: Write the output and move the task to in_review
      tags: [tasks]
      responses:
        '200': { description: reported }
        '404': { description: task or material not found }
        '409': { description: lease lost }
  /v1/tasks/decide:
    post:
      operationId: decideTask
      summary: Approve or reject a task
      tags: [tasks]
      responses:
        '200': { description: decided }
        '400': { description: invalid decision or missing reason }
        '404': { description: task or material not found }
        '409': { description: task is not in review }
  /v1/tasks/reset:
    post:
      operationId: resetTask
      summary: Re-queue a failed task
      tags: [tasks]
      responses:
        '200': { description: reset }
        '404': { description: not found }
        '409': { description: task is not failed }
  /v1/tasks/dependencies:
    get:
      operationId: listTaskDependencies
      summary: Business ids a task depends on
      tags: [tasks]
      responses:
        '200': { description: dependencies }
        '400': { description: task_id is required }
  /v1/tasks/attachments:
    get:
      operationId: listTaskAttachments
      summary: Attachments of one task
      tags: [tasks]
      responses:
        '200': { description: attachments }
        '400': { description: task_id is required }
  /v1/tasks/events:
    get:
      operationId: listTaskEvents
      summary: Task event timeline
      tags: [tasks]
      responses:
        '200': { description: events }
        '400': { description: task_id is required }
  /v1/decisions:
    get:
      operationId: listDecisions
      summary: Gate decisions of one task
      tags: [tasks]
      responses:
        '200': { description: decisions }
        '400': { description: task_id is required }
  /v1/flow:
    get:
      operationId: getFlow
      summary: The effective stage table (configured order, name→id mapping, derive rules)
      description: |
        Returns the flow the running process loaded: `auto`, `default` (true when
        the configuration had no flow section and the built-in default took
        over), `source` (the YAML path, or `<builtin>`), `fingerprint` (the
        12-character digest the derivation events carry) and `stages[]`.

        Every stage carries `id` (= `tasks.kind`), `name` (the public identifier
        clients send as `kind`), `label` (display name, = name when unset),
        `material`, `open_cards` (`single` / `multiple`), `closing`, the card
        templates `title` / `description` as written ("" = not configured) and
        `derive` (`{mode, to, source, format, items}`).

        The list is the stage table in configured order; no query parameters. A
        running process always serves its startup snapshot, so editing the file
        without a restart changes nothing here.
      tags: [tasks]
      responses:
        '200': { description: the effective flow }
  /v1/inbox:
    get:
      operationId: listInbox
      summary: Ready and in-review tasks
      tags: [tasks]
      responses:
        '200': { description: tasks }
  /v1/workers/heartbeat:
    post:
      operationId: workerHeartbeat
      summary: Register or refresh a worker
      description: |
        Body `{worker_id, kinds, metadata}` (`state` is accepted and ignored —
        occupancy is derived from `current_work_item_id`). `worker_id` is
        client-generated and required; the server neither generates nor returns
        one. Heartbeat is an upsert: it refreshes `last_seen` and **replaces**
        `kinds` / `metadata` wholesale, never touches the task pointer.

        The answer is **204 with an empty body** — no worker object, no command
        list. To read back the registration result use
        `GET /v1/workers?id=<worker_id>` (see `presence` there).
      tags: [workers]
      responses:
        '204': { description: accepted — empty body }
        '400': { description: invalid_argument — blank worker_id, unknown field, or invalid kind }
  /v1/workers:
    get:
      operationId: listWorkers
      summary: List workers, or fetch one by id
      description: |
        Without `id` a page of rows is returned as `{"items":[...]}`; with `id`
        the single worker is returned as a bare object (detail ⊇ list).

        List item fields: `worker_id`, `kinds`, `state` (`idle`/`busy`),
        `current_task_id` (internal row id, omitted when idle), `current_work_item_id`
        (task business id `t_...`, explicit `null` when idle), `current_lease_id`
        (omitted when idle), `last_seen`, `presence`.

        Detail adds `first_seen`, `heartbeat_interval_ms`, `lease_ttl_seconds`,
        `metadata`, and always carries `current_task_id` / `current_lease_id`
        (explicit `null` when idle).

        `presence` is derived by the server from `last_seen + worker_ttl` and is
        `active` or `offline`; one derivation per response, and list/detail agree
        for the same row. Clients must not re-derive it from `last_seen`.
      tags: [workers]
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: Worker id. When the key is present the detail object is returned instead of a page; a blank value is a 400 naming the field.
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: Page size for the list form. Defaults to 100 when omitted or not positive; a non-numeric value falls back to the default.
      responses:
        '200': { description: 'worker page (items[] of the list fields) or the bare detail object' }
        '400': { description: 'invalid_argument — blank id (details[0].field == "id")' }
        '404': { description: 'not_found — id the registry never had, or one retention already retired' }
  /v1/materials:
    post:
      operationId: createMaterial
      summary: Store an inline markdown artifact
      tags: [materials]
      responses:
        '201': { description: created }
        '400': { description: invalid kind or empty body }
        '413': { description: too large }
    get:
      operationId: downloadMaterial
      summary: Download a material object
      tags: [materials]
      responses:
        '200': { description: object bytes }
        '404': { description: not found }
