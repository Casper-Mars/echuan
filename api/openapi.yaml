components:
  headers:
    RequestId:
      description: 请求关联 id；入站值原样回显，缺省时服务端生成。
      schema:
        type: string
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: false
      description: 调用者声明（非认证）。
      schema:
        type: string
    ResourceID:
      name: id
      in: query
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 期望的乐观锁版本号（裸整数，或带引号的 ETag 形式）。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数或请求体不合法
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 状态、版本、租约或唯一性冲突
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: 请求体超过限制
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks, request_id]
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
    Version:
      type: object
      additionalProperties: false
      required: [version, commit, go_version]
      properties:
        version:
          type: string
        commit:
          type: string
        go_version:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
          enum:
            - invalid_argument
            - not_found
            - invalid_state
            - invalid_version
            - conflict
            - lease_lost
            - material_required
            - too_large
            - rate_limited
            - internal
            - method_not_allowed
            - timeout
            - range_not_satisfiable
            - worker_unknown
            - worker_busy
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        request_id:
          type: string
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [product_id, name, git_url]
      properties:
        product_id:
          type: string
        name:
          type: string
        git_url:
          type: string
        description:
          type: string
        license:
          type: string
    ProductPatchRequest:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
        name:
          type: string
        git_url:
          type: string
        description:
          type: string
        license:
          type: string
    Product:
      type: object
      additionalProperties: false
      required: [id, product_id, name, git_url, description, license, project_count, create_time, update_time]
      properties:
        id:
          type: string
        product_id:
          type: string
        name:
          type: string
        git_url:
          type: string
        description:
          type: string
        license:
          type: string
