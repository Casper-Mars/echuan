      required: [worker_id, presence, state, kinds, current_work_item_id, metadata, first_seen, last_seen, heartbeat_interval_ms, lease_ttl_seconds]
      description: |
        注册表里一个 worker 的读模型。十个字段在每条响应（心跳、列表、详情）里
        恒定出现：`current_work_item_id` 空闲时为 `null`，`metadata` 未提供时为 `{}`。
      properties:
        worker_id:
          type: string
          description: 服务端生成的 `w_` 前缀业务 id；客户端只读。
        presence:
          type: string
          enum: [active, offline]
        state:
          type: string
          enum: [idle, busy]
          description: worker 最近一次心跳声明的状态；占用只看 current_work_item_id。
        kinds:
          type: array
          items:
            type: string
            enum: [requirement, design, breakdown, dev]
          description: 最近一次心跳声明的可执行 kind；每次覆盖。
        current_work_item_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        heartbeat_interval_ms:
          type: integer
        lease_ttl_seconds:
          type: integer
    WorkerHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [kinds]
      description: |
        worker_id 缺省表示首次注册；state 缺省为 idle；kinds 必填且非空，
        每次心跳覆盖已存声明；metadata 缺省表示不修改已存文档。
      properties:
        worker_id:
          type: string
        state:
          type: string
          enum: [idle, busy]
        kinds:
          type: array
          minItems: 1
          items:
            type: string
            enum: [requirement, design, breakdown, dev]
        metadata:
          type: object
          additionalProperties: true
    WorkerCommand:
      type: object
      additionalProperties: false
      required: [kind, dispatch]
      properties:
        kind:
          type: string
          enum: [dispatch]
        dispatch:
          $ref: "#/components/schemas/Dispatch"
    WorkerHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [worker, commands]
      description: 心跳 200 响应；`commands` 恒为数组（无任务时 `[]`）。
      properties:
        worker:
          $ref: "#/components/schemas/Worker"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/WorkerCommand"
    WorkerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        next_cursor:
          type: string
    InboxItem:
      type: object
      additionalProperties: false
      required: [kind, id, state, title, update_time, age_seconds, stale, reason]
      properties:
        kind:
          type: string
        id:
          type: string
        state:
          type: string
        title:
          type: string
        update_time:
          type: string
        age_seconds:
          type: integer
        stale:
          type: boolean
        reason:
          type: string
          nullable: true
    InboxResponse:
      type: object
      additionalProperties: false
      required: [items, count, review_stale_hours, generated_at]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"
        count:
          type: integer
        review_stale_hours:
          type: integer
        generated_at:
          type: string
          format: date-time
