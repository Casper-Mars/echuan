openapi: 3.0.3
info:
  title: 驿传平台 API
  version: 1.0.0
  description: |
    驿传（echuan）HTTP 接口契约。所有 /v1 响应都携带 X-Request-Id 头；
    错误响应统一使用 Error 错误体，details 永远是数组（无明细时为 []）。
    资源列表与详情共用同一路径（?id= 选择详情），因此一个 method+path
    只计一个 operation。
servers:
  - url: http://127.0.0.1:8720
tags:
  - name: health
    description: 存活、就绪与版本信息
  - name: products
    description: 产品
  - name: projects
    description: 项目（需求、规格、方案与评审）
  - name: tasks
    description: 任务、领取、心跳、报告与验收
  - name: materials
    description: 物料下载与版本链
  - name: inbox
    description: 待评审收件箱
  - name: workers
    description: Worker 注册、心跳与在线查询
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      tags: [health]
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针
      tags: [health]
      responses:
        "200":
          description: 就绪
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪（保留 checks 并带 request_id）
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /version:
    get:
      operationId: getVersion
      summary: 构建版本
      tags: [health]
      responses:
        "200":
          description: 版本信息
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/products:
    post:
      operationId: createProduct
      summary: 创建产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetProducts
      summary: 列出产品，或按 ?id= 取详情
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 详情（?id=）或分页列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Product"
                  - $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: 修改产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchRequest"
      responses:
        "200":
          description: 已修改
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      summary: 删除没有项目的产品
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: 已删除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects:
    post:
      operationId: createProject
      summary: 创建项目并写入首个需求版本
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetProjects
      summary: 列出项目，或按 ?id= 取详情
      description: |
        不带 ?id= 时返回项目分页列表，按项目 id 倒序（最新在前）；cursor 为上一页最后一条的 id，
        下一页返回更早的项目。带 ?id= 时返回该项目的详情。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 按项目状态过滤（九态）：0 requirement_draft / 1 requirement_review / 2 spec_draft / 3 spec_review / 4 tasks_draft / 5 tasks_review / 6 pending_done / 7 completed / 8 cancelled
          schema:
            type: integer
            enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 详情（?id=）或分页列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProjectDetail"
                  - $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      summary: 修改项目标题
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
      responses:
        "200":
          description: 已修改
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: 删除草稿或已取消的项目
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: 已删除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/requirement:
    post:
      operationId: writeProjectRequirement
      summary: 追加需求版本
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementRequest"
      responses:
        "200":
          description: 需求版本已追加
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/specs:
    post:
      operationId: submitProjectSpec
      summary: 提交规格版本
      description: 兼容接口：修订项目第一份独立方案；返回涵盖全部当前方案的版本化方案包。单文档时沿用原资料及版本链。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRequest"
      responses:
        "200":
          description: 规格版本已提交
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/plans:
    post:
      operationId: submitProjectPlan
      summary: 批量添加任务卡
      description: |
        向 `tasks_draft`(4) / `tasks_review`(5) / `pending_done`(6) 的项目批量添加任务卡，
        新卡一律以 `backlog`(0) 落库。项目处于 `tasks_draft` 时，本批第一张卡会在同一事务里
        把项目推进到 `tasks_review`(5)。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "201":
          description: 方案已提交
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/projects/submit:
    post:
      operationId: submitProject
      summary: 草稿提交评审
      description: |
        按当前状态进入对应的评审门：
        - `requirement_draft`(0) → `requirement_review`(1)：要求需求文档已存在；
        - `spec_draft`(2) → `spec_review`(3)：要求至少存在一份方案文档。
        提交会清空 `reason`。

        `requirement_draft` 缺少需求文档时返回 409 `invalid_state`，message 固定为
        `请先上传需求文档`；前端在提交前会先读取项目详情并做同样的拦截。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 已进入评审
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/decide:
    post:
      operationId: decideProject
      summary: 审批项目评审门
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDecideRequest"
      responses:
        "200":
          description: 已审批
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/cancel:
    post:
      operationId: cancelProject
      summary: 取消非终态项目
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 已取消
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/projects/materials:
    get:
      operationId: listProjectMaterials
      summary: 查询某一类物料的版本链
      tags: [materials]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - name: kind
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 2]
      responses:
        "200":
          description: 版本链
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs:
    get:
      operationId: listOrGetSpecDocument
      summary: 查询独立技术方案列表或全文与历史版本
      description: id 指定方案时返回详情，可用 material_id 阅读该方案历史版本；否则必须用 project_id 查询列表。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          schema: {type: string}
        - name: project_id
          in: query
          schema: {type: string}
        - name: material_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: 独立方案详情或列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SpecDocument"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSpecDocument
      summary: 创建独立技术方案并更新项目方案包
      description: 仅规格评审、规划中可写。每份方案独立版本链；所有当前方案组成兼容旧接口及执行上下文的方案包。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, title, body_md]
              properties:
                project_id: {type: string}
                title: {type: string}
                body_md: {type: string}
      responses:
        "201":
          description: 独立方案已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    patch:
      operationId: reviseSpecDocument
      summary: 修订独立方案并生成新的项目方案包
      description: If-Match 为该独立文档的版本；任何方案修订也递增项目版本，使旧项目评审请求失效。
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, body_md]
              properties:
                title: {type: string}
                body_md: {type: string}
      responses:
        "200":
          description: 新版本已保存
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpecDocument"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/tasks:
    post:
      operationId: createTask
      summary: 在规划中的项目里新增任务
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: 已创建
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listOrGetTasks
      summary: 列出任务，或按 ?id= 取详情
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 详情（?id=）或分页列表
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TaskDetail"
                  - $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      summary: 修改任务标题、正文或优先级
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
      responses:
        "200":
          description: 已修改
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      summary: 删除未领取的待办任务
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: 已删除
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/claim:
    post:
      operationId: claimTask
      summary: 领取下一张可执行任务
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: 已领取
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "204":
          description: |
            没有可领取的任务（空响应体，不写任务租约，也不动 worker 指针）。
            带 `worker_id` 时同样返回 204：队列为空，或该卡在同一事务里已被另一个
            worker 抢走。**不同 worker 并发抢同一张卡时，失败方一律按"无任务可领"
            返回 204**（不是 409），这是并发抢卡失败的唯一口径。客户端应按退避
            轮询，不应把 204 当错误重试。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            仅在请求体带 `worker_id` 时出现，两个码都由 worker 注册表决定：
            - `worker_unknown`：id 不在注册表中（未注册或已被保留期回收），
              worker 应先调 `POST /v1/workers/heartbeat` 重新注册拿新 id；
            - `worker_busy`：该 worker 已持有任务卡（`current_task_id` 非空）。
              并发抢卡失败不属于本码，见 204。
            与 200 同属一次事务：返回 409 时任务、租约、指针均未被修改。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
