  /v1/work-items/report:
    post:
      operationId: reportWorkItem
      summary: 交付一张租约中的 work item（material_id / summary_md / plan）
      description: |
        报告完成后工作项进入 `submitted`。若该卡是阶段工作项，同一事务内还会
        推进项目：requirement 0→1（需需求指针）、design 2→3（需至少一份方案）、
        breakdown 4→5；前置不足返回 409 `invalid_state` 并整体回滚，租约保留。

        非 breakdown 卡必须提供 `material_id` 或 `summary_md`（二选一）：前者引用
        已有物料，后者由平台在同一事务里落成 `kind=3` 报告物料并回填
        `result_material_id`。`kind=breakdown` 的报告必须携带 `plan`（可省略
        `material_id`，不允许 `summary_md`）：计划通过
        结构校验后，同一事务内生成 N 条 `kind=dev`、`state=blocked`、
        `parent_id` 指向该 breakdown 的子项，并写入依赖边。计划门批准前子项不可
        claim，批准后统一转 `queued`。同一 breakdown 重复报告返回 409
        `conflict`；任何校验或写入失败都回滚整个报告（租约、项目、子项均不变）。
      tags: [work-items]
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: 已提交，state=submitted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
