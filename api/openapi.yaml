            绑定了 worker 时才有值，其余状态一律为 `null`。
            任务-06 之前领取的 in_progress 卡没有 worker 指针（旧式 claim），
            此时 `status=2` 但该字段同样为 `null`。与列表里的同名字段一致。
        attempt_count:
