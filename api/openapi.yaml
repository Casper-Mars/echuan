components:
  headers:
    RequestId:
      description: 请求关联 id；入站值原样回显，缺省时服务端生成。
      schema:
        type: string
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: false
      description: 调用者声明（非认证）。
      schema:
        type: string
    ResourceID:
      name: id
      in: query
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 期望的乐观锁版本号（裸整数，或带引号的 ETag 形式）。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数或请求体不合法
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 状态、版本、租约或唯一性冲突
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: 请求体超过限制
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 声明身份无权执行该操作（门禁只接受人工决策）
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
