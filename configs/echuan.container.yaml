# echuan v2 容器配置（只读挂载到 /etc/echuan/echuan.yaml）
#
# 生效优先级：环境变量（ECHUAN_*） > 本文件 > 内置默认值。
# 容器内监听必须为 0.0.0.0，否则宿主机端口映射无法访问。
# 数据目录固定为 /data，由 docker-compose.yml 绑定到宿主机 ~/echuan-v2-data。
# 格式只支持 YAML（.yaml/.yml）；旧版 TOML 配置已不再解析。

listen: "0.0.0.0:8720"

# SQLite 库、objects 的根目录（容器内路径）
data_dir: "/data"

# SQLite 读连接池大小（写池固定为 1）
read_pool_size: 4

# 任务租约有效期（Go duration 语法）
lease_ttl: "90s"

# 单个任务允许的最大尝试次数
max_attempts: 3

# claim 长轮询超时
poll_timeout: "25s"

# 评审超过该小时数未处理视为 stale
review_stale_hours: 72

# 单个素材允许的最大字节数（20 MiB）
material_max_bytes: 20971520

# Worker 存活时间：注册后超过该时长未心跳即视为离线（Go duration 语法）
worker_ttl: "45s"

# Worker 心跳间隔，需显著小于 worker_ttl
heartbeat_interval: "15s"

# Worker 注册时 metadata 允许的最大字节数（默认 8 KiB）
worker_metadata_max_bytes: 8192

# 离线 Worker 状态的保留时长（默认 1 小时，需大于 worker_ttl，Go duration 语法）
worker_retention: "1h"

# 日志级别：debug / info / warn / error
log_level: "info"

# ---------- 飞书机器人（可选，默认关闭） ----------
im:
  enabled: false
  app_id: ""
  app_secret: ""
  allowed_chat_ids: []
  poll_interval: "30s"
  quiet_hours: "23:00-08:00"
  max_cards: 10
  doc_folder_token: ""

# ---------- 任务流程 ----------
# 删掉整段 flow 会启用手里的内置默认流程，效果与下面这份逐字段一致。
# description = 阶段描述（给人看）；task = 派生卡的任务说明模板（进卡正文）。
# 旧版的 flow.auto / flow.default_description 已删除：留着也不读不管、不影响派生与指纹。
flow:
  stages:
    - id: 1
      name: requirement
      label: 需求
      material: requirement
      description: "人工建卡入口，不自动派生下游"
      derive: { auto: true, to: design, mode: single }
    - id: 2
      name: design
      label: 方案
      material: design
      title: "技术方案"
      description: "把需求展开成技术方案：目标与范围、接口与数据、风险与验证方式"
      task: ""
      derive: { auto: true, to: breakdown, mode: single }
    - id: 3
      name: breakdown
      label: 拆解
      material: plan
      title: "任务拆分"
      description: "把方案拆成可独立验收的开发卡"
      task: ""
      derive: { auto: true, to: dev, mode: list, source: artifact, format: json }
    - id: 4
      name: dev
      label: 开发
      material: report
      open_cards: multiple
      closing: true
      description: "实现与自测，交付物写入任务报告"
      derive: { mode: none }
