name: docker publish (ACR)

# 合并进 main 就构建镜像并推送到阿里云 ACR（个人版）。
# 用 push 触发器而不是 pull_request[closed]：合并的结果就是一次 main 上的 push，
# 这样既覆盖 PR 合并，也覆盖直接推 main（含 hotfix），且不会因 PR 关闭但未合并而误构建。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:
    inputs:
      platform:
        description: '目标架构（amd64 / arm64 / 逗号分隔多架构）'
        required: false
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  ACR_REPO: ${{ vars.ACR_REPO || 'echuan' }}

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: vars
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "platform=${{ inputs.platform || 'linux/amd64,linux/arm64' }}" >> "$GITHUB_OUTPUT"

      - name: Guard registry config
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ACR_REGISTRY:-}" ] || missing="$missing vars.ACR_REGISTRY"
          [ -n "${ACR_NAMESPACE:-}" ] || missing="$missing vars.ACR_NAMESPACE"
          [ -n "${ACR_USERNAME:-}" ] || missing="$missing secrets.ACR_USERNAME"
          [ -n "${ACR_PASSWORD:-}" ] || missing="$missing secrets.ACR_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置:$missing（见 docs/deploy-acr.md）"
            exit 1
          fi
          echo "registry: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=echuan
            org.opencontainers.image.description=驿传单二进制服务（Docker 部署）
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.vars.outputs.platform }}
          push: true
          # ACR 控制台对 buildx 默认的 provenance/attestation 产物兼容性差
          # （镜像大小显示为 0 或空），显式关掉，输出标准 manifest v2 schema2。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct
            NPM_REGISTRY=https://registry.npmmirror.com
            APK_MIRROR=mirrors.aliyun.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 已推送镜像"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- version: \`${{ steps.vars.outputs.version }}\`"
            echo "- commit: \`${{ steps.vars.outputs.commit }}\`"
            echo "- platform: \`${{ steps.vars.outputs.platform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
